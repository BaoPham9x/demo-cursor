module:
  identifier: customer_features
  schema: steep_demo_v2
  table: fact_customer_features
  label: Customer Features
  description: Product feature flags per customer (adoption / activation).
  dimensions:
    - column: feature_name
      label: Feature Name
      type: categorical
    - column: feature_category
      label: Feature Category
      type: categorical
    - column: is_active
      label: Is Active
      type: categorical
    - column: activated_at
      label: Activated At
      type: time
    - column: last_used_at
      label: Last Used At
      type: time
  metrics:
    - identifier: unique_customers_with_features
      name: Unique Customers With Features
      description: Row count at customer-feature grain (use with distinct patterns in Steep as needed).
      calculation: count
      time: fact_customer_features.activated_at
      category: Product
      dimensions:
        - feature_name
        - feature_category
      time_grains:
        - daily
        - weekly
        - monthly
    - identifier: feature_adoption_rate
      name: Feature Adoption Rate
      description: Distinct customers with features over customer population (requires join graph to dim_customer).
      calculation: custom-ratio
      numerator_sql: "COUNT(DISTINCT fact_customer_features.customer_key)"
      denominator_sql: "COUNT(dim_customer.customer_id)"
      format: percentage
      time: fact_customer_features.activated_at
      category: Product
      dimensions:
        - feature_category
      time_grains:
        - daily
        - weekly
        - monthly
