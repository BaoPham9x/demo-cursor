module:
  identifier: visitors
  schema: steep_demo_v2
  table: fact_visitors
  label: Fact Visitors
  description: Daily aggregated web traffic by network/channel/country/campaign; joins ad spend via visitor_key.
  dimensions:
    - column: visitor_date
      label: Visitor date
      type: time
    - column: network
      label: Network
      type: categorical
    - column: channel
      label: Channel
      type: categorical
    - column: country
      label: Country
      type: country
    - column: campaign_name
      label: Campaign name
      type: categorical
  metrics:
    - identifier: total_visitors
      name: Total Visitors
      calculation: sum
      value: fact_visitors.total_visitors
      time: fact_visitors.visitor_date
      time_grains:
        - daily
        - weekly
        - monthly
      category: Marketing
      owner_emails:
        - marketing@acmepay.com
      dimensions:
        - network
        - channel
        - country
    - identifier: visitor_conversion_rate
      name: Visitor Conversion Rate
      calculation: custom-ratio
      numerator_sql: "SUM(fact_visitors.total_conversions)"
      denominator_sql: "SUM(fact_visitors.total_visitors)"
      format: percentage
      time: fact_visitors.visitor_date
      time_grains:
        - daily
        - weekly
        - monthly
      category: Marketing
      owner_emails:
        - marketing@acmepay.com
      dimensions:
        - network
        - channel
        - country
  joinPaths:
    - from:
        column: visitor_key
      to:
        schema: steep_demo_v2
        table: fact_ad_spend
        column: visitor_key
      type: one-to-many
    - from:
        column: date_key
      to:
        schema: steep_demo_v2
        table: dim_date
        column: date_key
      type: one-to-one
