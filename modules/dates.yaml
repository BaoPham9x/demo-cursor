module:
  identifier: dates
  schema: steep_demo_v2
  table: dim_date
  label: Dates
  description: Calendar spine 2024-01-01 through 2026-12-31 for date intelligence.
  dimensions:
    - column: date
      label: Date
      type: time
    - column: month_name
      label: Month name
      type: categorical
    - column: day_name
      label: Day name
      type: categorical
    - column: is_weekend
      label: Is weekend
      type: categorical
    - column: is_month_end
      label: Is month end
      type: categorical
  joinPaths:
    - from:
        column: date_key
      to:
        schema: steep_demo_v2
        table: fact_visitors
        column: date_key
      type: one-to-many
