module:
  identifier: "subscriptions"
  schema: "steep_demo_v2"
  table: "fact_subscriptions"
  dimensions:
    - column: "billing_cycle"
      type: "categorical"
      label: "Billing Cycle"
    - column: "plan_name"
      type: "categorical"
      label: "Plan Name"
    - column: "status"
      type: "categorical"
      label: "Status"
    - column: "currency"
      type: "categorical"
      label: "Currency"
  metrics:
    - identifier: "avg_monthly_price"
      name: "Avg Monthly Price"
      time: "fact_subscriptions.started_at"
      description: "The average monthly subscription price across all active subscriptions. This helps us understand pricing trends and the typical revenue per subscription."
      time_grains:
        - "monthly"
        - "quarterly"
        - "yearly"
      calculation: "custom-value"
      sql_expression: "AVG(fact_subscriptions.monthly_price)"
      owner_emails:
        - "angelina@steep.app"
        - "deanne@steep.app"
        - "janna@steep.app"
        - "sebastian@steep.app"
      filters:
        - column: "status"
          operator: "equals"
          expression: "active"
      category: "Commercial"
      dimensions:
        - "currency"
        - "status"
        - "dim_customer.first_name"
        - "dim_customer.last_name"
        - "dim_customer.email"
        - "dim_customer.country"
        - "dim_customer.city"
        - "dim_customer.region"
        - "dim_customer.timezone"
        - "dim_customer.registration_source"
        - "dim_customer.kyb_status"
        - "dim_customer.customer_tier"
        - "dim_customer.account_status"
        - "plan_name"
        - "billing_cycle"
