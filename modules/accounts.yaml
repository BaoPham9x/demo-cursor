module:
  identifier: accounts
  schema: steep_demo_v2
  table: dim_account
  label: Dim Accounts
  description: Bank account dimension per customer (checking/savings, limits, balances).
  dimensions:
    - column: account_type
      label: Account type
      type: categorical
    - column: account_status
      label: Account status
      type: categorical
    - column: currency
      label: Currency
      type: categorical
    - column: created_at
      label: Created at
      type: time
    - column: balance_updated_at
      label: Balance updated at
      type: time
  metrics:
    - identifier: avg_credit_limit
      name: Avg Credit Limit
      calculation: custom-value
      sql_expression: "AVG(dim_account.credit_limit)"
      time: dim_account.created_at
      time_grains:
        - daily
        - weekly
        - monthly
      category: Operations
      owner_emails:
        - ops@acmepay.com
      dimensions:
        - account_type
        - currency
  joinPaths:
    - from:
        column: account_id
      to:
        schema: steep_demo_v2
        table: fact_transactions
        column: account_key
      type: one-to-many
    - from:
        column: account_key
      to:
        schema: steep_demo_v2
        table: fact_risk_events
        column: account_key
      type: one-to-many
