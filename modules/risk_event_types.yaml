module:
  identifier: risk_event_types
  schema: steep_demo_v2
  table: dim_risk_event_type
  label: Risk Event Types
  description: Distinct risk event types with default severity mapping.
  dimensions:
    - column: event_type
      label: Event type
      type: categorical
    - column: default_severity
      label: Default severity
      type: categorical
  joinPaths:
    - from:
        column: risk_event_type_key
      to:
        schema: steep_demo_v2
        table: fact_risk_events
        column: risk_event_type_key
      type: one-to-many
