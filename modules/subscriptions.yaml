module:
  identifier: subscriptions
  schema: steep_demo_v2
  table: fact_subscriptions
  label: Subscriptions
  description: Subscription rows with MRR/ARR, plan, billing cycle, lifecycle timestamps.
  dimensions:
    - column: plan_name
      label: Plan name
      type: categorical
    - column: currency
      label: Currency
      type: categorical
    - column: status
      label: Status
      type: categorical
    - column: billing_cycle
      label: Billing cycle
      type: categorical
    - column: billing_paused_at
      label: Billing paused at
      type: time
    - column: suspended_at
      label: Suspended at
      type: time
    - column: started_at
      label: Started at
      type: time
    - column: ended_at
      label: Ended at
      type: time
    - column: created_at
      label: Created at
      type: time
  metrics:
    - identifier: subscriptions_mrr
      name: MRR by Plan
      calculation: sum
      value: fact_subscriptions.mrr
      time: fact_subscriptions.started_at
      time_grains:
        - monthly
        - quarterly
        - yearly
      filters:
        - column: status
          operator: equals
          expression: active
      category: Commercial
      owner_emails:
        - finance@acmepay.com
      dimensions:
        - plan_name
        - billing_cycle
        - dim_customer.country
        - dim_customer.customer_tier
    - identifier: subscriptions_arr
      name: ARR by Plan
      calculation: sum
      value: fact_subscriptions.arr
      time: fact_subscriptions.started_at
      time_grains:
        - monthly
        - quarterly
        - yearly
      filters:
        - column: status
          operator: equals
          expression: active
      category: Commercial
      owner_emails:
        - finance@acmepay.com
      dimensions:
        - plan_name
        - billing_cycle
        - dim_customer.country
        - dim_customer.customer_tier
    - identifier: avg_monthly_price
      name: Avg Monthly Price
      calculation: custom-value
      sql_expression: "AVG(fact_subscriptions.monthly_price)"
      time: fact_subscriptions.started_at
      time_grains:
        - monthly
        - quarterly
        - yearly
      filters:
        - column: status
          operator: equals
          expression: active
      category: Commercial
      owner_emails:
        - finance@acmepay.com
      dimensions:
        - plan_name
        - billing_cycle
  joinPaths:
    - from:
        column: customer_key
      to:
        schema: steep_demo_v2
        table: dim_customer
        column: customer_key
      type: one-to-one
