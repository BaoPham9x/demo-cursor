module:
  identifier: "ad_spend"
  schema: "steep_demo_v2"
  table: "fact_ad_spend"
  label: "Fact Ad spend"
  description: ""
  dimensions:
    - column: "country"
      type: "country"
      label: "Country"
    - column: "campaign_name"
      type: "categorical"
      label: "Campaign name"
    - column: "currency"
      type: "categorical"
      label: "Currency"
    - column: "channel"
      type: "categorical"
      label: "Channel"
    - column: "network"
      type: "categorical"
      label: "Network"
  metrics:
    - identifier: "ad_conversion_rate"
      name: "Ad Conversion Rate"
      time: "fact_ad_spend.created_at"
      description: "The percentage of ad spend that resulted in customer conversions. This metric shows how efficiently our advertising budget is generating new customers. Higher is better."
      calculation: "custom-ratio"
      numerator_sql: "SUM(fact_ad_spend.conversions)"
      denominator_sql: "SUM(fact_ad_spend.amount)"
      format: "percentage"
      owner_emails:
        - "deanne@steep.app"
      category: "Marketing"
      dimensions:
        - "currency"
        - "campaign_name"
        - "fact_visitors.campaign_name"
        - "fact_visitors.country"
        - "fact_visitors.channel"
        - "fact_visitors.network"
        - "network"
        - "channel"
        - "country"
    - identifier: "ad_conversions"
      name: "Ad Conversions"
      time: "fact_ad_spend.created_at"
      description: "Total count of new customer signups that can be attributed to our advertising campaigns. This shows how many customers our ads are bringing in."
      calculation: "sum"
      value: "fact_ad_spend.conversions"
      owner_emails:
        - "deanne@steep.app"
        - "johan@steep.app"
      category: "Marketing"
      dimensions:
        - "currency"
        - "fact_visitors.network"
        - "fact_visitors.channel"
        - "fact_visitors.country"
        - "fact_visitors.campaign_name"
        - "network"
        - "channel"
        - "country"
    - identifier: "ad_spend"
      name: "Ad spend"
      time: "fact_ad_spend.created_at"
      description: "Total amount of money spent on advertising across all marketing channels (Google, Meta, YouTube, etc.). This is our marketing budget metric showing where our advertising dollars are going."
      calculation: "sum"
      value: "fact_ad_spend.amount"
      owner_emails:
        - "deanne@steep.app"
      category: "Marketing"
      dimensions:
        - "campaign_name"
        - "country"
    - identifier: "conversion_rate"
      name: "% Ad-spend per conversion"
      time: "fact_ad_spend.created_at"
      description: "The percentage of ad spend that resulted in customer conversions. This metric shows how efficiently your advertising budget is generating new customers. Higher is better."
      is_unlisted: true
      calculation: "custom-ratio"
      numerator_sql: "SUM(fact_ad_spend.conversions)"
      denominator_sql: "SUM(fact_ad_spend.amount)"
      format: "percentage"
      owner_emails:
        - "bao@steep.app"
      category: "In-review"
      dimensions:
        - "network"
        - "channel"
        - "country"
    - identifier: "avg_ad_spend_per_day"
      name: "Avg Ad Spend per Day"
      time: "fact_ad_spend.created_at"
      description: "Average amount spent on advertising per day. This helps us understand our daily marketing budget and spending patterns."
      calculation: "custom-value"
      sql_expression: "AVG(fact_ad_spend.amount)"
      owner_emails:
        - "deanne@steep.app"
      category: "Marketing"
      dimensions:
        - "network"
        - "channel"
    - identifier: "cpa"
      name: "Cost per Acquisition (CPA)"
      time: "fact_ad_spend.created_at"
      description: "The average cost to acquire one new customer through advertising. This is calculated as total ad spend divided by total conversions. Lower CPA means more efficient customer acquisition."
      calculation: "custom-ratio"
      numerator_sql: "SUM(fact_ad_spend.amount)"
      denominator_sql: "SUM(fact_ad_spend.conversions)"
      format: "number"
      owner_emails:
        - "deanne@steep.app"
      category: "Marketing"
      dimensions:
        - "network"
        - "channel"
        - "country"
    - identifier: "total_conversions"
      name: "Total Conversions - adspend"
      time: "fact_ad_spend.created_at"
      description: "Total count of new customer signups that can be attributed to your advertising campaigns. This shows how many customers your ads are bringing in."
      calculation: "sum"
      value: "fact_ad_spend.conversions"
      owner_emails:
        - "deanne@steep.app"
      category: "Marketing"
      dimensions:
        - "campaign_name"
        - "currency"
        - "network"
        - "channel"
        - "country"
    - identifier: "untitled"
      name: "Untitled"
      time: "fact_ad_spend.created_at"
      calculation: "custom-value"
      sql_expression: "SUM(case when fact_visitors.visitor_date >= DATE_ADD(CURRENT_DATE(), INTERVAL - 7 DAY)  then 1 else 0 end)"
