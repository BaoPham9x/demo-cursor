module:
  identifier: "customer_features"
  schema: "steep_demo_v2"
  table: "fact_customer_features"
  dimensions:
    - column: "feature_category"
      type: "categorical"
      label: "Feature Category"
    - column: "feature_name"
      type: "categorical"
      label: "Feature Name"
    - column: "is_active"
      type: "categorical"
      label: "Is Active"
  metrics:
    - identifier: "unique_customers_with_features"
      name: "Customers with Features"
      time: "fact_customer_features.activated_at"
      description: "Count of unique customers who have activated and are using at least one product feature. This shows feature adoption and how many customers are engaging with our product beyond basic usage."
      calculation: "count"
      category: "Product"
      dimensions:
        - "dim_customer.email"
        - "dim_customer.country"
        - "dim_customer.kyb_status"
        - "dim_customer.account_status"
        - "dim_customer.customer_tier"
        - "feature_name"
        - "feature_category"
    - identifier: "feature_adoption_rate"
      name: "Feature Adoption Rate"
      time: "fact_customer_features.activated_at"
      description: "The percentage of all customers who have activated at least one product feature. This measures how well customers are discovering and using our product features. Higher adoption typically indicates better product engagement."
      calculation: "custom-ratio"
      numerator_sql: "COUNT(DISTINCT fact_customer_features.customer_key)"
      denominator_sql: "COUNT(dim_customer.customer_id)"
      format: "percentage"
      category: "Product"
      dimensions:
        - "feature_name"
