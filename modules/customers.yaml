module:
  identifier: customers
  schema: steep_demo_v2
  table: dim_customer
  label: Dim Customer
  description: Customer dimension (SMB neobank). Includes KYB lifecycle, activation, tier, and derived fields is_activated, kyb_completion_days, time_to_activation_days.
  dimensions:
    - column: country
      label: Country
      type: country
    - column: city
      label: City
      type: city
    - column: region
      label: Region
      type: categorical
    - column: timezone
      label: Timezone
      type: categorical
    - column: registration_source
      label: Registration source
      type: categorical
    - column: kyb_status
      label: KYB status
      type: categorical
    - column: customer_tier
      label: Customer tier
      type: categorical
    - column: account_status
      label: Account status
      type: categorical
    - column: created_at
      label: Created at
      type: time
    - column: kyb_started_at
      label: KYB started at
      type: time
    - column: kyb_submitted_at
      label: KYB submitted at
      type: time
    - column: kyb_approved_at
      label: KYB approved at
      type: time
    - column: activated_at
      label: Activated at
      type: time
    - column: is_activated
      label: Is activated
      type: categorical
  metrics:
    - identifier: total_customers
      name: Customer Acquisition
      calculation: count
      time: dim_customer.created_at
      time_grains:
        - daily
        - weekly
        - monthly
      category: Commercial
      owner_emails:
        - finance@acmepay.com
      dimensions:
        - country
        - customer_tier
        - registration_source
    - identifier: registrations
      name: Registrations
      calculation: count
      time: dim_customer.created_at
      time_grains:
        - daily
        - weekly
        - monthly
      category: Marketing
      owner_emails:
        - marketing@acmepay.com
      dimensions:
        - registration_source
        - country
        - customer_tier
    - identifier: activated_customers
      name: Activated Customers
      calculation: count
      time: dim_customer.created_at
      time_grains:
        - daily
        - weekly
        - monthly
      filters:
        - column: is_activated
          operator: equals
          expression: "1"
      category: Commercial
      owner_emails:
        - finance@acmepay.com
      dimensions:
        - country
        - customer_tier
        - registration_source
    - identifier: activation_rate
      name: Activation Rate
      calculation: custom-ratio
      numerator_sql: "SUM(CASE WHEN dim_customer.is_activated = 1 THEN 1 END)"
      denominator_sql: "COUNT(*)"
      format: percentage
      time: dim_customer.created_at
      time_grains:
        - daily
        - weekly
        - monthly
      category: Marketing
      owner_emails:
        - marketing@acmepay.com
      dimensions:
        - registration_source
        - country
        - customer_tier
    - identifier: kyc_approved
      name: KYC Approved %
      calculation: custom-ratio
      numerator_sql: "SUM(CASE WHEN dim_customer.kyb_status = 'approved' THEN 1 END)"
      denominator_sql: "COUNT(*)"
      format: percentage
      time: dim_customer.created_at
      time_grains:
        - daily
        - weekly
        - monthly
      category: Operations
      owner_emails:
        - ops@acmepay.com
      dimensions:
        - country
        - customer_tier
    - identifier: avg_kyb_completion_days
      name: Avg KYC Completion Days
      calculation: custom-value
      sql_expression: "AVG(dim_customer.kyb_completion_days)"
      time: dim_customer.created_at
      time_grains:
        - daily
        - weekly
        - monthly
      category: Operations
      owner_emails:
        - ops@acmepay.com
      dimensions:
        - country
        - customer_tier
    - identifier: avg_time_to_activation
      name: Avg Time to Activation (Days)
      calculation: custom-value
      sql_expression: "AVG(dim_customer.time_to_activation_days)"
      time: dim_customer.created_at
      time_grains:
        - daily
        - weekly
        - monthly
      category: Operations
      owner_emails:
        - ops@acmepay.com
      dimensions:
        - registration_source
        - country
  joinPaths:
    - from:
        column: customer_key
      to:
        schema: steep_demo_v2
        table: dim_account
        column: customer_id
      type: one-to-many
    - from:
        column: customer_key
      to:
        schema: steep_demo_v2
        table: fact_transactions
        column: customer_key
      type: one-to-many
    - from:
        column: customer_key
      to:
        schema: steep_demo_v2
        table: fact_subscriptions
        column: customer_key
      type: one-to-many
    - from:
        column: customer_key
      to:
        schema: steep_demo_v2
        table: fact_agg_arr
        column: customer_key
      type: one-to-many
    - from:
        column: customer_key
      to:
        schema: steep_demo_v2
        table: fact_risk_events
        column: customer_key
      type: one-to-many
    - from:
        column: customer_key
      to:
        schema: steep_demo_v2
        table: fact_customer_features
        column: customer_key
      type: one-to-many
