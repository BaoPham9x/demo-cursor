module:
  identifier: "agg_arr"
  schema: "steep_demo_v2"
  table: "fact_agg_arr"
  label: "Aggregated ARR"
  description: "Monthly snapshots of Annual Recurring Revenue (ARR) per subscription. This fact table provides time-series data showing ARR contributions for each active subscription at the end of each month."
  dimensions:
    - column: "plan_name"
      type: "categorical"
      label: "Plan Name"
    - column: "status"
      type: "categorical"
      label: "Status"
    - column: "billing_cycle"
      type: "categorical"
      label: "Billing Cycle"
    - column: "currency"
      type: "categorical"
      label: "Currency"
  metrics:
    - identifier: "active_subscriptions"
      name: "Active Subscriptions"
      time: "fact_agg_arr.snapshot_date"
      description: "Count of active subscriptions in the monthly snapshot. This shows how many subscriptions are contributing to ARR each month."
      time_grains:
        - "monthly"
        - "quarterly"
        - "yearly"
      calculation: "count"
      owner_emails:
        - "deanne@steep.app"
      category: "Commercial"
      dimensions:
        - "plan_name"
        - "status"
        - "billing_cycle"
        - "currency"
        - "dim_customer.customer_tier"
    - identifier: "avg_arr_per_subscription"
      name: "Avg ARR per Subscription"
      time: "fact_agg_arr.snapshot_date"
      description: "Average ARR contribution per active subscription. This helps us understand the typical value of each subscription and can indicate if we're attracting higher-value customers over time."
      time_grains:
        - "monthly"
        - "quarterly"
        - "yearly"
      calculation: "custom-ratio"
      numerator_sql: "SUM(fact_agg_arr.arr_contribution)"
      denominator_sql: "COUNT(DISTINCT fact_agg_arr.subscription_id)"
      format: "number"
      owner_emails:
        - "deanne@steep.app"
        - "sebastian@steep.app"
      category: "Commercial"
      dimensions:
        - "status"
        - "dim_customer.first_name"
        - "dim_customer.last_name"
        - "dim_customer.email"
        - "dim_customer.country"
        - "dim_customer.city"
        - "dim_customer.region"
        - "dim_customer.timezone"
        - "dim_customer.registration_source"
        - "dim_customer.customer_tier"
        - "dim_customer.kyb_status"
        - "dim_customer.account_status"
        - "plan_name"
        - "billing_cycle"
        - "currency"
    - identifier: "mrr"
      name: "Monthly Recurring Revenue (MRR)"
      time: "fact_agg_arr.snapshot_date"
      description: "Total Monthly Recurring Revenue across all active subscriptions. MRR is calculated as ARR divided by 12, representing the monthly revenue from subscriptions."
      time_grains:
        - "monthly"
        - "quarterly"
        - "yearly"
      calculation: "sum"
      value: "fact_agg_arr.mrr"
      category: "Commercial"
      dimensions:
        - "dim_customer.first_name"
        - "dim_customer.last_name"
        - "dim_customer.email"
        - "dim_customer.country"
        - "dim_customer.city"
        - "dim_customer.region"
        - "dim_customer.timezone"
        - "dim_customer.registration_source"
        - "dim_customer.kyb_status"
        - "dim_customer.account_status"
        - "plan_name"
        - "status"
        - "billing_cycle"
        - "currency"
        - "dim_customer.customer_tier"
    - identifier: "total_arr"
      name: "Total ARR"
      time: "fact_agg_arr.snapshot_date"
      description: "Total Annual Recurring Revenue across all active subscriptions for the month. This is the sum of all subscription ARR contributions in the snapshot period."
      time_grains:
        - "monthly"
        - "quarterly"
        - "yearly"
      calculation: "sum"
      value: "fact_agg_arr.arr_contribution"
      category: "Commercial"
      dimensions:
        - "dim_customer.email"
        - "dim_customer.last_name"
        - "dim_customer.first_name"
        - "dim_customer.city"
        - "dim_customer.region"
        - "dim_customer.timezone"
        - "dim_customer.kyb_status"
        - "dim_customer.registration_source"
        - "dim_customer.account_status"
        - "plan_name"
        - "status"
        - "billing_cycle"
        - "currency"
        - "dim_customer.customer_tier"
        - "dim_customer.country"
