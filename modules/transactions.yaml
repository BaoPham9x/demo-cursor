module:
  identifier: transactions
  schema: steep_demo_v2
  table: fact_transactions
  label: Transactions
  description: >
    Placeholder module while the Steep-as-code layer is rebuilt. One metric retained
    so sync clearly shows an intentional partial state (remove when the new layer is ready).
  dimensions:
    - column: country
      label: Country
      type: country
    - column: transaction_type
      label: Transaction Type
      type: categorical
  metrics:
    - identifier: transaction_count
      name: Transaction Count
      description: Row count at transaction grain; sole metric until semantic layer is redone.
      calculation: count
      time: fact_transactions.created_at
