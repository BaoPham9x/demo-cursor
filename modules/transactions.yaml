module:
  identifier: transactions
  schema: steep_demo_v2
  table: fact_transactions
  label: Transactions
  description: One row per money movement (card_spend, payment, deposit, withdrawal, transfer). Joins to customer, account, merchant; can relate to risk events on transaction_id.
  dimensions:
    - column: merchant_name
      label: Merchant name
      type: categorical
    - column: merchant_category
      label: Merchant category
      type: categorical
    - column: transaction_type
      label: Transaction type
      type: categorical
    - column: status
      label: Status
      type: categorical
    - column: currency
      label: Currency
      type: categorical
    - column: payment_method
      label: Payment method
      type: categorical
    - column: risk_flag
      label: Risk flag
      type: categorical
    - column: country
      label: Country
      type: country
    - column: city
      label: City
      type: city
    - column: h3_res_1
      label: H3 res 1
      type: h3-cell-index
    - column: h3_res_2
      label: H3 res 2
      type: h3-cell-index
    - column: h3_res_3
      label: H3 res 3
      type: h3-cell-index
    - column: h3_res_4
      label: H3 res 4
      type: h3-cell-index
    - column: h3_res_5
      label: H3 res 5
      type: h3-cell-index
    - column: h3_res_6
      label: H3 res 6
      type: h3-cell-index
    - column: h3_res_7
      label: H3 res 7
      type: h3-cell-index
    - column: h3_res_8
      label: H3 res 8
      type: h3-cell-index
    - column: h3_res_9
      label: H3 res 9
      type: h3-cell-index
    - column: h3_res_10
      label: H3 res 10
      type: h3-cell-index
    - column: location_key
      label: Location key
      type: categorical
    - column: created_at
      label: Created at
      type: time
  metrics:
    - identifier: revenue
      name: Revenue
      calculation: sum
      value: fact_transactions.amount
      time: fact_transactions.created_at
      time_grains:
        - daily
        - weekly
        - monthly
      filters:
        - column: status
          operator: equals
          expression: completed
      category: Commercial
      owner_emails:
        - finance@acmepay.com
      dimensions:
        - country
        - dim_customer.customer_tier
        - transaction_type
    - identifier: transaction_volume
      name: Transaction Volume (TPV)
      calculation: sum
      value: fact_transactions.amount
      time: fact_transactions.created_at
      time_grains:
        - daily
        - weekly
        - monthly
      filters:
        - column: status
          operator: equals
          expression: completed
      category: Commercial
      owner_emails:
        - finance@acmepay.com
      dimensions:
        - country
        - dim_customer.customer_tier
        - transaction_type
    - identifier: transaction_count
      name: Transaction Count
      calculation: count
      time: fact_transactions.created_at
      time_grains:
        - daily
        - weekly
        - monthly
      category: Operations
      owner_emails:
        - ops@acmepay.com
      dimensions:
        - country
        - transaction_type
        - payment_method
    - identifier: completed_transactions
      name: Completed Transactions
      calculation: count
      time: fact_transactions.created_at
      time_grains:
        - daily
        - weekly
        - monthly
      filters:
        - column: status
          operator: equals
          expression: completed
      category: Operations
      owner_emails:
        - ops@acmepay.com
      dimensions:
        - country
        - payment_method
        - transaction_type
    - identifier: failed_transactions
      name: Failed Transactions
      calculation: count
      time: fact_transactions.created_at
      time_grains:
        - daily
        - weekly
        - monthly
      filters:
        - column: status
          operator: equals
          expression: failed
      category: Operations
      owner_emails:
        - ops@acmepay.com
      dimensions:
        - country
        - payment_method
        - transaction_type
    - identifier: high_risk_transactions
      name: High Risk Transactions
      calculation: count
      time: fact_transactions.created_at
      time_grains:
        - daily
        - weekly
        - monthly
      filters:
        - column: risk_flag
          operator: in
          expression: high_risk,suspicious,aml_review
      category: Risk
      owner_emails:
        - risk@acmepay.com
      dimensions:
        - country
        - payment_method
        - transaction_type
    - identifier: fraud_rate_transactions
      name: Fraud Flag Rate
      description: Share of transactions flagged high_risk, suspicious, or aml_review.
      calculation: custom-ratio
      numerator_sql: "SUM(CASE WHEN fact_transactions.risk_flag IN ('high_risk','suspicious','aml_review') THEN 1 ELSE 0 END)"
      denominator_sql: "COUNT(*)"
      format: percentage
      time: fact_transactions.created_at
      time_grains:
        - daily
        - weekly
        - monthly
      category: Risk
      owner_emails:
        - risk@acmepay.com
      dimensions:
        - country
        - payment_method
        - transaction_type
    - identifier: success_rate
      name: Transaction Success Rate
      calculation: custom-ratio
      numerator_sql: "SUM(CASE WHEN fact_transactions.status = 'completed' THEN 1 END)"
      denominator_sql: "COUNT(*)"
      format: percentage
      time: fact_transactions.created_at
      time_grains:
        - daily
        - weekly
        - monthly
      category: Operations
      owner_emails:
        - ops@acmepay.com
      dimensions:
        - country
        - payment_method
        - transaction_type
    - identifier: avg_transaction_amount
      name: Avg Transaction Amount
      calculation: custom-ratio
      numerator_sql: "SUM(fact_transactions.amount)"
      denominator_sql: "COUNT(*)"
      format: number
      time: fact_transactions.created_at
      time_grains:
        - daily
        - weekly
        - monthly
      filters:
        - column: status
          operator: equals
          expression: completed
      category: Operations
      owner_emails:
        - ops@acmepay.com
      dimensions:
        - country
        - transaction_type
  joinPaths:
    - from:
        column: transaction_id
      to:
        schema: steep_demo_v2
        table: fact_risk_events
        column: transaction_id
      type: one-to-many