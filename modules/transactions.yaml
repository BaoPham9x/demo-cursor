module:
  identifier: transactions
  schema: steep_demo_v2
  table: fact_transactions
  label: Transactions
  description: >
    One row per money movement (card_spend, payment, deposit, withdrawal, transfer).
    Joins to customer, account, merchant; can relate to risk events on transaction_id.
  dimensions:
    - column: merchant_name
      label: Merchant Name
      type: categorical
    - column: merchant_category
      label: Merchant Category
      type: categorical
    - column: transaction_type
      label: Transaction Type
      type: categorical
    - column: status
      label: Status
      type: categorical
    - column: currency
      label: Currency
      type: categorical
    - column: payment_method
      label: Payment Method
      type: categorical
    - column: risk_flag
      label: Risk Flag
      type: categorical
    - column: country
      label: Country
      type: country
    - column: city
      label: City
      type: city
    - column: h3_res_5
      label: H3 Res 5
      type: h3-cell-index
    - column: location_key
      label: Location Key
      type: categorical
    - column: created_at
      label: Created At
      type: time
  metrics:
    - identifier: revenue
      name: Revenue
      description: Sum of completed transaction amounts (USD).
      calculation: sum
      value: fact_transactions.amount
      time: fact_transactions.created_at
      filters:
        - column: status
          operator: equals
          expression: completed
      category: Commercial
      owner_emails:
        - finance@acmepay.com
      dimensions:
        - country
        - transaction_type
        - dim_customer.customer_tier
      time_grains:
        - daily
        - weekly
        - monthly
      slices:
        - name: US
          filter:
            column: country
            operator: equals
            expression: US
    - identifier: transaction_volume
      name: Transaction Volume (TPV)
      description: Total payment volume on completed transactions.
      calculation: sum
      value: fact_transactions.amount
      time: fact_transactions.created_at
      filters:
        - column: status
          operator: equals
          expression: completed
      category: Commercial
      owner_emails:
        - finance@acmepay.com
      dimensions:
        - country
        - transaction_type
        - dim_customer.customer_tier
      time_grains:
        - daily
        - weekly
        - monthly
      slices:
        - name: US
          filter:
            column: country
            operator: equals
            expression: US
    - identifier: transaction_count
      name: Transaction Count
      description: Row count at transaction grain.
      calculation: count
      time: fact_transactions.created_at
      category: Operations
      owner_emails:
        - ops@acmepay.com
      dimensions:
        - country
        - transaction_type
        - payment_method
      time_grains:
        - daily
        - weekly
        - monthly
    - identifier: completed_transactions
      name: Completed Transactions
      description: Count of completed transactions.
      calculation: count
      time: fact_transactions.created_at
      filters:
        - column: status
          operator: equals
          expression: completed
      category: Operations
      owner_emails:
        - ops@acmepay.com
      dimensions:
        - country
        - payment_method
        - transaction_type
      time_grains:
        - daily
        - weekly
        - monthly
    - identifier: failed_transactions
      name: Failed Transactions
      description: Count of failed transactions for concentration analysis.
      calculation: count
      time: fact_transactions.created_at
      filters:
        - column: status
          operator: equals
          expression: failed
      category: Operations
      owner_emails:
        - ops@acmepay.com
      dimensions:
        - country
        - payment_method
        - transaction_type
        - city
      time_grains:
        - daily
        - weekly
        - monthly
      slices:
        - name: US
          filter:
            column: country
            operator: equals
            expression: US
    - identifier: high_risk_transactions
      name: High-Risk Transaction Rows
      description: Count of transactions with elevated risk flags.
      calculation: count
      time: fact_transactions.created_at
      filters:
        - column: risk_flag
          operator: in
          expression: high_risk,suspicious,aml_review
      category: Risk
      owner_emails:
        - risk@acmepay.com
      dimensions:
        - country
        - payment_method
        - transaction_type
      time_grains:
        - daily
        - weekly
        - monthly
    - identifier: success_rate
      name: Transaction Success Rate
      description: Share of transactions that completed successfully.
      calculation: custom-ratio
      numerator_sql: "SUM(CASE WHEN fact_transactions.status = 'completed' THEN 1 END)"
      denominator_sql: "COUNT(*)"
      format: percentage
      time: fact_transactions.created_at
      category: Operations
      owner_emails:
        - ops@acmepay.com
      dimensions:
        - country
        - payment_method
        - transaction_type
      time_grains:
        - daily
        - weekly
        - monthly
    - identifier: avg_transaction_amount
      name: Avg Transaction Amount
      description: Average amount on completed transactions.
      calculation: custom-ratio
      numerator_sql: "SUM(fact_transactions.amount)"
      denominator_sql: "COUNT(*)"
      format: number
      time: fact_transactions.created_at
      filters:
        - column: status
          operator: equals
          expression: completed
      category: Operations
      owner_emails:
        - ops@acmepay.com
      dimensions:
        - country
        - transaction_type
      time_grains:
        - daily
        - weekly
        - monthly
    - identifier: transaction_risk_flag_rate
      name: Fraud-Flag Transaction Rate
      description: Share of transactions flagged high_risk, suspicious, or aml_review.
      calculation: custom-ratio
      numerator_sql: "SUM(CASE WHEN fact_transactions.risk_flag IN ('high_risk','suspicious','aml_review') THEN 1 END)"
      denominator_sql: "COUNT(*)"
      format: percentage
      time: fact_transactions.created_at
      category: Risk
      owner_emails:
        - risk@acmepay.com
      dimensions:
        - country
        - payment_method
        - transaction_type
      time_grains:
        - daily
        - weekly
        - monthly
  joinPaths:
    - from:
        column: transaction_id
      to:
        table: fact_risk_events
        column: transaction_id
      type: one-to-many
