module:
  identifier: merchants
  schema: steep_demo_v2
  table: dim_merchant
  label: Merchants
  description: Distinct merchants derived from transactions (merchant_key = name|category).
  dimensions:
    - column: merchant_name
      label: Merchant name
      type: categorical
    - column: merchant_category
      label: Merchant category
      type: categorical
  joinPaths:
    - from:
        column: merchant_key
      to:
        schema: steep_demo_v2
        table: fact_transactions
        column: merchant_key
      type: one-to-many
