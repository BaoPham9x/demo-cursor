module:
  identifier: ad_spend
  schema: steep_demo_v2
  table: fact_ad_spend
  label: Fact Ad spend
  description: Ad spend rows with conversions; visitor_key aligns to fact_visitors for marketing ROI.
  dimensions:
    - column: network
      label: Network
      type: categorical
    - column: channel
      label: Channel
      type: categorical
    - column: campaign_name
      label: Campaign name
      type: categorical
    - column: country
      label: Country
      type: country
    - column: currency
      label: Currency
      type: categorical
    - column: created_at
      label: Created at
      type: time
  metrics:
    - identifier: ad_spend
      name: Ad Spend
      calculation: sum
      value: fact_ad_spend.amount
      time: fact_ad_spend.created_at
      time_grains:
        - daily
        - weekly
        - monthly
      category: Marketing
      owner_emails:
        - marketing@acmepay.com
      dimensions:
        - network
        - channel
        - country
    - identifier: ad_conversions
      name: Ad Conversions
      calculation: sum
      value: fact_ad_spend.conversions
      time: fact_ad_spend.created_at
      time_grains:
        - daily
        - weekly
        - monthly
      category: Marketing
      owner_emails:
        - marketing@acmepay.com
      dimensions:
        - network
        - channel
        - country
    - identifier: cpa
      name: Cost per Acquisition (CPA)
      calculation: custom-ratio
      numerator_sql: "SUM(fact_ad_spend.amount)"
      denominator_sql: "SUM(fact_ad_spend.conversions)"
      format: number
      time: fact_ad_spend.created_at
      time_grains:
        - daily
        - weekly
        - monthly
      category: Marketing
      owner_emails:
        - marketing@acmepay.com
      dimensions:
        - network
        - channel
        - country
  joinPaths:
    - from:
        column: visitor_key
      to:
        schema: steep_demo_v2
        table: fact_visitors
        column: visitor_key
      type: one-to-many
