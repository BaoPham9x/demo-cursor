module:
  identifier: ad_spend
  schema: steep_demo_v2
  table: fact_ad_spend
  label: Fact Ad spend
  description: Ad spend rows with conversions; visitor_key aligns to fact_visitors for marketing ROI.
  dimensions:
    - column: network
      label: Network
      type: categorical
    - column: channel
      label: Channel
      type: categorical
    - column: campaign_name
      label: Campaign Name
      type: categorical
    - column: country
      label: Country
      type: country
    - column: currency
      label: Currency
      type: categorical
    - column: created_at
      label: Created At
      type: time
  metrics:
    - identifier: ad_spend
      name: Ad Spend
      description: Total paid media spend.
      calculation: sum
      value: fact_ad_spend.amount
      time: fact_ad_spend.created_at
      category: Marketing
      owner_emails:
        - marketing@acmepay.com
      dimensions:
        - network
        - channel
        - country
      time_grains:
        - daily
        - weekly
        - monthly
      slices:
        - name: US
          filter:
            column: country
            operator: equals
            expression: US
    - identifier: ad_conversions
      name: Ad Conversions
      description: Sum of attributed conversions from ad rows.
      calculation: sum
      value: fact_ad_spend.conversions
      time: fact_ad_spend.created_at
      category: Marketing
      owner_emails:
        - marketing@acmepay.com
      dimensions:
        - network
        - channel
        - country
      time_grains:
        - daily
        - weekly
        - monthly
    - identifier: cpa
      name: Cost per Acquisition (CPA)
      description: Ad spend divided by conversions for ROI by network.
      calculation: custom-ratio
      numerator_sql: "SUM(fact_ad_spend.amount)"
      denominator_sql: "SUM(fact_ad_spend.conversions)"
      format: number
      time: fact_ad_spend.created_at
      category: Marketing
      owner_emails:
        - marketing@acmepay.com
      dimensions:
        - network
        - channel
        - country
      time_grains:
        - daily
        - weekly
        - monthly
      slices:
        - name: US
          filter:
            column: country
            operator: equals
            expression: US
