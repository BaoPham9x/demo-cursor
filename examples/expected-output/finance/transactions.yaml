module:
  identifier: transactions
  schema: steep_demo_v2
  table: fact_transactions
  label: Transactions
  description: One row per money movement (card_spend, payment, deposit, withdrawal, transfer).
  dimensions:
    - column: merchant_category
      label: Merchant Category
      type: categorical
    - column: transaction_type
      label: Transaction Type
      type: categorical
    - column: status
      label: Status
      type: categorical
    - column: currency
      label: Currency
      type: categorical
    - column: payment_method
      label: Payment Method
      type: categorical
    - column: country
      label: Country
      type: country
    - column: created_at
      label: Created At
      type: time
  metrics:
    - identifier: revenue
      name: Revenue
      calculation: sum
      value: fact_transactions.amount
      time: fact_transactions.created_at
      category: Commercial
      owner_emails:
        - finance@acmepay.com
      filters:
        - column: status
          operator: equals
          expression: completed
      dimensions:
        - country
        - transaction_type
        - payment_method
        - merchant_category
    - identifier: transaction_volume
      name: Transaction Volume
      calculation: sum
      value: fact_transactions.amount
      time: fact_transactions.created_at
      category: Commercial
      owner_emails:
        - finance@acmepay.com
      filters:
        - column: status
          operator: equals
          expression: completed
      dimensions:
        - country
        - transaction_type
        - payment_method
  joinPaths:
    - from:
        column: transaction_id
      to:
        table: fact_risk_events
        column: transaction_id
      type: one-to-many
