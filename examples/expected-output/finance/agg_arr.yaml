module:
  identifier: agg_arr
  schema: steep_demo_v2
  table: fact_agg_arr
  label: Aggregated ARR
  description: Monthly ARR snapshot per active subscription (time series for MRR/ARR reporting).
  dimensions:
    - column: snapshot_date
      label: Snapshot Date
      type: time
    - column: month_key
      label: Month Key
      type: categorical
    - column: plan_name
      label: Plan Name
      type: categorical
    - column: currency
      label: Currency
      type: categorical
    - column: status
      label: Status
      type: categorical
    - column: billing_cycle
      label: Billing Cycle
      type: categorical
    - column: is_active
      label: Is Active
      type: categorical
  metrics:
    - identifier: mrr
      name: MRR
      calculation: sum
      value: fact_agg_arr.mrr
      time: fact_agg_arr.snapshot_date
      category: Commercial
      owner_emails:
        - finance@acmepay.com
      time_grains:
        - monthly
        - quarterly
        - yearly
      dimensions:
        - plan_name
        - billing_cycle
        - currency
    - identifier: total_arr
      name: Total ARR
      calculation: sum
      value: fact_agg_arr.arr_contribution
      time: fact_agg_arr.snapshot_date
      category: Commercial
      owner_emails:
        - finance@acmepay.com
      time_grains:
        - monthly
        - quarterly
        - yearly
      dimensions:
        - plan_name
        - billing_cycle
        - currency
    - identifier: avg_arr_per_subscription
      name: Avg ARR per Subscription
      calculation: custom-ratio
      numerator_sql: "SUM(fact_agg_arr.arr_contribution)"
      denominator_sql: "COUNT(DISTINCT fact_agg_arr.subscription_id)"
      format: number
      time: fact_agg_arr.snapshot_date
      category: Commercial
      owner_emails:
        - finance@acmepay.com
      time_grains:
        - monthly
        - quarterly
        - yearly
      dimensions:
        - plan_name
        - billing_cycle
